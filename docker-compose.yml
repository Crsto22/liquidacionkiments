services:
  liquidacionkiments:
    build:
      context: .
      dockerfile: Dockerfile
    image: liquidacionkiments:latest
    container_name: liquidacionkiments
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3004}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: America/Lima
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3000/login > /dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
